[project]
name = "trilha-backend-python"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "fbguimaraes", email = "fbguimaraes.ads@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
trilha-backend-python = "trilha_backend_python:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "-ra"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
